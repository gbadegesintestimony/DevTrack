services:
  # ====================================================
  # DevTrack Backend API Web Service
  # ====================================================
  - type: web
    name: devtrack-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: devtrack-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set to your deployed Vercel URL (e.g. https://devtrack.vercel.app)

databases:
  # ====================================================
  # DevTrack Managed PostgreSQL Database
  # ====================================================
  - name: devtrack-db
    plan: free
    region: oregon
    databaseName: devtrack
    user: devtrack_user
